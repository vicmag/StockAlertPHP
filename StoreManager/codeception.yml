namespace: Tests
support_namespace: Support
paths:
    tests: tests
    output: tests/_output
    data: tests/Support/Data
    support: tests/Support
    envs: tests/_envs
actor_suffix: Tester
extensions:
    enabled:
        - Codeception\Extension\RunFailed

coverage:
    enabled: true
    include:
        - src/*
    exclude:
        - tests/*
        - vendor/*
    # Umbrales mínimos (opcional)
    low_limit: 70
    high_limit: 90
