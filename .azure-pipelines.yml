# .azure-pipelines.yml

# trigger:
#   - development
trigger: none
pr: none

parameters:
- name: branchExecution
  type: string
  default: 'development'

pool:
  name: Default
  demands:
    - agent.name -equals iMac

jobs:
  - job: buildAndTest
    displayName: Build y pruebas con Docker
    steps:
      - checkout: self

      - script: |
          docker build -t phalcon-tdd:latest -f .devcontainer/Dockerfile .
        displayName: 'Construir imagen Docker'

      - script: |
          docker run --rm \
            -v $(Build.SourcesDirectory):/workspace \
            -w /workspace/StoreManager \
            phalcon-tdd composer install
        displayName: 'Instalar dependencias en contenedor'

      - script: |
          docker run --rm \
            -v $(Build.SourcesDirectory):/workspace \
            -w /workspace/StoreManager \
            phalcon-tdd ls -la vendor/mockery/mockery
        displayName: 'Verificar instalación de Mockery'

      - script: |
          docker run --rm \
            -v $(Build.SourcesDirectory):/workspace \
            -w /workspace/StoreManager \
            -e XDEBUG_MODE=coverage \
            phalcon-tdd ./vendor/bin/phpunit Tests
        displayName: 'Ejecutar pruebas con PHPUnit'

