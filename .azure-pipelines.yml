trigger:
  - development

pool:
  name: Default
  demands:
    - agent.name -equals iMac


jobs:
  - job: buildAndTest
    displayName: Build y pruebas con Docker
    steps:
      - checkout: self

      - task: Docker@2
        displayName: 'Build Docker Image'
        inputs:
          command: 'build'
          Dockerfile: '**/Dockerfile'
          tags: |
            phalcon-tdd:latest


      - script: |
          docker run --rm -v $(Build.SourcesDirectory):/workspace -w /workspace phalcon-tdd composer install
        displayName: 'Instalar dependencias en contenedor'

      - script: |
          docker run --rm -v $(Build.SourcesDirectory):/workspace -w /workspace phalcon-tdd ./vendor/bin/phpunit
        displayName: 'Ejecutar pruebas en contenedor'
